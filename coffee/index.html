<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coffee — tnzs</title>
  <meta name="description" content="Coffee brewing calculator — ratios, grind size, and water for every method.">

  <link rel="icon" id="favicon" type="image/png" href="data:,">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Outfit:wght@100..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/hero.css">
  <link rel="stylesheet" href="/assets/css/coffee.css">
</head>
<body>

  <!-- Page transition overlay -->
  <div class="page-transition" aria-hidden="true"></div>

  <!-- Nav Drawer (unchanged) -->
  <div class="nav-drawer" id="navDrawer" role="dialog" aria-label="Site menu" aria-modal="true" aria-hidden="true">
    <nav class="drawer-nav" aria-label="Main navigation">
      <ul class="drawer-links">
        <li><a href="/" class="drawer-link" data-i18n="nav.work">Work</a></li>
        <li><a href="/about" class="drawer-link" data-i18n="nav.about">About</a></li>
        <li><a href="/contact" class="drawer-link" data-i18n="nav.contact">Contact</a></li>
      </ul>
    </nav>
    <div class="drawer-footer">
      <button class="drawer-lang" aria-label="Switch language">
        <span data-lang="en">EN</span>
        <span class="lang-sep"> | </span>
        <span data-lang="es">ES</span>
      </button>
      <a href="https://instagram.com/tnzs.wtf"
         target="_blank"
         rel="noopener noreferrer"
         class="drawer-ig">@tnzs.wtf</a>
    </div>
  </div>

  <!-- Nav (unchanged) -->
  <nav class="scroll-nav is-visible" aria-label="Site navigation">
    <div class="scroll-nav__left">
      <a href="/" class="scroll-nav__logo" aria-label="tnzs — home">
        <img src="/assets/logo.svg" alt="tnzs">
      </a>
    </div>
    <div class="scroll-nav__right">
      <button class="scroll-nav__burger"
              id="burgerBtn"
              aria-label="Toggle menu"
              aria-expanded="false">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main id="main-content" role="main">

    <!-- Hero -->
    <section class="coffee-hero">
      <div class="coffee-hero-scanlines" aria-hidden="true"></div>
      <div class="coffee-hero-glow" aria-hidden="true"></div>
      <div class="coffee-hero-grid" aria-hidden="true"></div>
      <div class="coffee-hero-inner">
        <p class="coffee-eyebrow" data-i18n="coffee.eyebrow">Brew Guide</p>
        <h1 class="coffee-headline" data-i18n="coffee.headline">Coffee Calculator</h1>
        <div class="coffee-hero-sub" aria-hidden="true">
          <span class="coffee-hero-bar"></span>
          <span class="coffee-hero-sys">SYS://BREW_CALC v2.1</span>
        </div>
      </div>
    </section>

    <!-- Tool -->
    <section class="coffee-tool">
      <div class="coffee-tool-grid" aria-hidden="true"></div>
      <div class="coffee-inner">

        <!-- Step 1: Method -->
        <div class="coffee-step">
          <span class="coffee-step-label" data-i18n="coffee.method">Brewing Method</span>
          <div class="method-grid" role="group" aria-label="Brewing method">
            <button class="method-btn is-active" data-method="v60">V60</button>
            <button class="method-btn" data-method="cloth">Chorreado</button>
            <button class="method-btn" data-method="frenchpress">French Press</button>
            <button class="method-btn" data-method="aeropress">Aeropress</button>
            <button class="method-btn" data-method="espresso">Espresso</button>
            <button class="method-btn" data-method="mokapot">Moka Pot</button>
            <button class="method-btn" data-method="coldbrew">Cold Brew</button>
          </div>
        </div>

        <!-- Steps 2 + 3 side by side -->
        <div class="coffee-controls">

          <!-- Step 2: Water -->
          <div class="coffee-step coffee-step--inline">
            <span class="coffee-step-label" data-i18n="coffee.water">Water</span>
            <div class="ratio-display">
              <span class="ratio-value" id="waterValue">300</span>
              <span class="ratio-prefix">g</span>
            </div>
            <input class="ratio-slider" id="waterSlider" type="range" min="50" max="5000" step="10" value="300" aria-label="Water amount in grams">
          </div>

          <!-- Step 3: Ratio -->
          <div class="coffee-step coffee-step--inline">
            <span class="coffee-step-label" data-i18n="coffee.ratio">Ratio</span>
            <div class="ratio-display">
              <span class="ratio-prefix">1 :</span>
              <span class="ratio-value" id="ratioValue">16</span>
            </div>
            <input class="ratio-slider" id="ratioSlider" type="range" min="1" max="25" step="0.5" value="16" aria-label="Ratio">
            <span class="ratio-hint">
              <span data-i18n="coffee.recommended">Recommended</span>
              <span id="ratioRecommended">1 : 16</span>
            </span>
          </div>

        </div>

        <!-- Result -->
        <div class="coffee-result hud-panel" id="coffeeResult" aria-live="polite">
          <div class="hud-corner" aria-hidden="true"></div>

          <div class="result-row result-row--main">
            <div class="result-stat">
              <span class="result-label" data-i18n="coffee.coffee">Coffee</span>
              <span class="result-value result-value--pink" id="resultCoffee">18.8</span>
              <span class="result-unit">g</span>
            </div>
            <div class="result-divider" aria-hidden="true"></div>
            <div class="result-stat result-stat--right">
              <span class="result-label" data-i18n="coffee.water">Water</span>
              <span class="result-value result-value--cyan" id="resultWater">300</span>
              <span class="result-unit">g</span>
            </div>
          </div>

          <div class="result-row result-row--grind">
            <span class="result-grind-label" data-i18n="coffee.grind">Grind Size</span>
            <div class="result-grind-info">
              <span class="result-clicks" id="resultClicks">15</span>
              <span class="result-clicks-word" data-i18n="coffee.clicks">clicks</span>
              <span class="result-grind-sep">·</span>
              <span class="result-grind-range-label" data-i18n="coffee.clickRange">range</span>
              <span class="result-grind-range" id="resultRange">12–18</span>
              <span class="result-grind-sep">·</span>
              <span class="result-grind-name" id="resultGrindName">Medium Fine</span>
            </div>
          </div>

          <div class="result-row result-row--meta">
            <span class="result-meta" data-i18n="coffee.grinder">Timemore C3S</span>
            <span class="result-meta-sep">·</span>
            <span class="result-meta" data-i18n="coffee.temp">Water Temp</span>
            <span class="result-meta result-temp" id="resultTemp">93–98°C</span>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- Footer — cyberpunk rework -->
  <footer class="cp-footer is-visible" role="contentinfo">
    <div class="cp-footer-left">
      <button class="cp-lang-btn" aria-label="Switch language">
        <span data-lang="en">EN</span>
        <span class="cp-lang-sep">/</span>
        <span data-lang="es">ES</span>
      </button>
    </div>
    <div class="cp-footer-right">
      <button class="cp-color-toggle" id="colorToggle" aria-label="Toggle blue mode"></button>
      <a href="https://instagram.com/tnzs.wtf"
         class="cp-footer-icon"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5"

             aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>

         class="cp-footer-icon"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="WhatsApp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

      <a href="/" class="cp-footer-logo" aria-label="tnzs — home">
        <img src="/assets/logo.svg" alt="tnzs">
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/assets/js/lang.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/favicon.js"></script>
  <script src="/assets/js/coffee.js"></script>
</body>
</html>
